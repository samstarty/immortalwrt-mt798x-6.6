name: Build ImmortalWRT for MT7981-AX3000

on:
  workflow_dispatch:
    inputs:
      clean_workspace:
        description: 'Clean workspace before build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_branch:
        description: 'Branch to build'
        required: true
        default: 'openwrt-24.10-6.6'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Initialize environment (Fixed dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理不必要的软件
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          
          # 更新源并安装必要依赖
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 \
            python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            clang lld golang nodejs yarn
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "COMPILE_START_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Clean workspace
        if: ${{ github.event.inputs.clean_workspace == 'true' }}
        run: |
          rm -rf ./tmp ./bin ./build_dir ./staging_dir ./dl/* && mkdir -p ./tmp

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load MT7981-AX3000 configuration
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "COMPILE_END_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Organize output files
        run: |
          mkdir -p ./artifact/firmware ./artifact/buildinfo
          find ./bin/targets/ -name "*.bin" -exec cp {} ./artifact/firmware/ \;
          find ./bin/targets/ -name "*.buildinfo" -exec cp {} ./artifact/buildinfo/ \;
          find ./bin/targets/ -name "*.manifest" -exec cp {} ./artifact/buildinfo/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-ax3000-firmware-${{ env.COMPILE_START_TIME }}
          path: ./artifact/
          retention-days: 14
