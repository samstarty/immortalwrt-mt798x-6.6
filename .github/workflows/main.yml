name: Build ImmortalWRT for MT7981-AX3000

on:
  workflow_dispatch:
    inputs:
      clean_workspace:
        description: 'Clean workspace before build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_branch:
        description: 'Branch to build'
        required: true
        default: 'openwrt-24.10-6.6'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Install all required dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理并配置软件源
          sudo rm -rf /etc/apt/sources.list.d/*
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          
          # 彻底更新系统并修复依赖
          sudo -E apt-get -qq update
          sudo -E apt-get -qq full-upgrade -y
          sudo -E apt-get -qq install -f
          sudo -E dpkg --configure -a
          
          # 安装OpenWRT官方文档指定的所有依赖
          sudo -E apt-get -qq install \
            build-essential libc6-dev gcc g++ make \
            autoconf automake libtool pkgconf gettext \
            git subversion curl wget unzip bzip2 xz-utils \
            python3 python3-dev libpython3-dev \
            gawk flex bison diffutils patch \
            libncurses5-dev libncursesw5-dev libreadline-dev \
            zlib1g-dev libssl-dev libelf-dev \
            ccache cmake ninja-build \
            device-tree-compiler \
            libgmp3-dev libmpc-dev libmpfr-dev \
            libltdl-dev libglib2.0-dev \
            asciidoc xmlto texinfo \
            rsync squashfs-tools p7zip-full \
            golang clang lld \
            nodejs yarn \
            libtinfo5 lib32z1 libc6-dev-i386 \
            ack antlr3 autopoint fastjar gperf \
            haveged help2man intltool lrzsz \
            mkisofs msmtp nano qemu-utils \
            scons swig uglifyjs upx-ucl vim xxd
          
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "COMPILE_START_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Clean workspace
        if: ${{ github.event.inputs.clean_workspace == 'true' }}
        run: |
          rm -rf ./tmp ./bin ./build_dir ./staging_dir ./dl/* && mkdir -p ./tmp

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 确保feeds正确安装
          ./scripts/feeds install -f -a

      - name: Load MT7981-AX3000 configuration
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          # 强制更新配置，解决可能的配置冲突
          make defconfig FORCE=1

      - name: Download packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          # 首次编译使用单线程以更好地捕获错误
          make -j1 V=s
          echo "COMPILE_END_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Organize output files
        run: |
          mkdir -p ./artifact/firmware ./artifact/buildinfo
          find ./bin/targets/ -name "*.bin" -exec cp {} ./artifact/firmware/ \;
          find ./bin/targets/ -name "*.buildinfo" -exec cp {} ./artifact/buildinfo/ \;
          find ./bin/targets/ -name "*.manifest" -exec cp {} ./artifact/buildinfo/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-ax3000-firmware-${{ env.COMPILE_START_TIME }}
          path: ./artifact/
          retention-days: 14
