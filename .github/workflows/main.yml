name: Build ImmortalWRT for MT7981-AX3000

on:
  workflow_dispatch:
    inputs:
      clean_workspace:
        description: 'Clean workspace before build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_branch:
        description: 'Branch to build'
        required: true
        default: 'openwrt-24.10-6.6'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Fix Ubuntu sources and resolve dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理旧源配置
          sudo rm -rf /etc/apt/sources.list.d/*
          
          # 添加Ubuntu官方源（适用于Ubuntu 22.04）
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          
          # 更新源并修复可能的依赖问题
          sudo -E apt-get -qq update
          sudo -E apt-get -qq upgrade -y
          
          # 修复破损的依赖关系
          sudo -E apt-get -qq install -f
          sudo -E dpkg --configure -a
          
          # 安装aptitude（更强大的依赖解决工具）
          sudo -E apt-get -qq install aptitude
          
          # 使用aptitude安装基础依赖（自动解决冲突）
          sudo -E aptitude -y -q install \
            build-essential libc6-dev gcc g++ make \
            autoconf automake libtool pkgconf gettext \
            git curl wget unzip bzip2 xz-utils \
            python3 python3-dev libpython3-dev
          
          # 使用aptitude安装编译所需依赖
          sudo -E aptitude -y -q install \
            ack antlr3 asciidoc autopoint binutils bison \
            ccache cmake cpio device-tree-compiler fastjar flex gawk \
            gcc-multilib g++-multilib gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libssl-dev lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl vim xmlto xxd zlib1g-dev \
            clang lld golang nodejs yarn
          
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "COMPILE_START_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Clean workspace
        if: ${{ github.event.inputs.clean_workspace == 'true' }}
        run: |
          rm -rf ./tmp ./bin ./build_dir ./staging_dir ./dl/* && mkdir -p ./tmp

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load MT7981-AX3000 configuration
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "COMPILE_END_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Organize output files
        run: |
          mkdir -p ./artifact/firmware ./artifact/buildinfo
          find ./bin/targets/ -name "*.bin" -exec cp {} ./artifact/firmware/ \;
          find ./bin/targets/ -name "*.buildinfo" -exec cp {} ./artifact/buildinfo/ \;
          find ./bin/targets/ -name "*.manifest" -exec cp {} ./artifact/buildinfo/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt7981-ax3000-firmware-${{ env.COMPILE_START_TIME }}
          path: ./artifact/
          retention-days: 14
